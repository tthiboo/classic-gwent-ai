<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Гвинт — Ведьмак 3</title><link rel="stylesheet" href="style.css?v=20261015-10"></head><body>

<main><aside class="players"><div id="enemyPanel" class="player-panel"></div><div class="round-info"><small>РАУНД</small><strong id="roundNumber">I</strong><p id="turnStatus" role="status" aria-live="polite">Выберите фракцию</p><button id="passBtn" class="gold">Пас</button><button id="newBtn">Новая партия</button><nav><button id="fullscreenBtn" aria-label="Полный экран">⛶</button><button id="historyBtn" aria-label="Хроника партии">▤</button><button id="rulesBtn">Правила</button><button id="collectionBtn">Карты</button></nav></div><div id="ownPanel" class="player-panel"></div><div class="wolf-medallion" aria-hidden="true"><img src="assets/ui/wolf-medallion-adapted.webp" alt=""></div></aside>
<section class="table"><div class="table-heading"><span id="matchLabel">КЛАССИЧЕСКИЙ ГВИНТ</span></div><div id="arena" class="arena" aria-label="Поле для Гвинта"><div id="battleRows"></div><div id="boardZones"></div><div id="weather" class="weather"></div></div><div class="hand-heading"><span>ВАША РУКА <b id="handCount"></b></span><span id="hint">Выберите карту</span></div><div id="hand" class="hand" aria-label="Карты в вашей руке"></div></section>
<aside class="details"><button id="closeInspector" class="close" aria-label="Закрыть просмотр">×</button><div id="inspector"><p class="quiet">Выберите карту: её можно рассмотреть здесь в полном размере.</p></div></aside></main>
<dialog id="historyModal"><button id="closeHistory" class="close" aria-label="Закрыть хронику">×</button><h2>Хроника</h2><div id="log"></div></dialog><div id="cardReveal" hidden aria-live="polite"></div><div id="roundPause" hidden><strong id="roundSummary"></strong><button id="continueRound">Следующий раунд →</button></div>
<div id="toast" role="alert" hidden></div>
<dialog id="setup"><button class="close" id="closeSetup" aria-label="Закрыть">×</button><h1>Гвинт</h1><div id="factionTabs"></div><div class="setup-grid"><section><label>Ваша фракция<select id="faction"></select></label><p id="factionAbility" class="ability"></p><div id="leaderPreview" class="leader-preview"></div><label><select aria-label="Лидер" id="leader"></select></label></section><section><label>Фракция бота<select id="opponent"></select></label><p id="enemyAbility" class="ability"></p><div id="enemyLeaderPreview" class="leader-preview"></div><label hidden><select id="enemyLeader"></select></label></section></div><div class="setup-bottom"><label hidden><select id="difficulty"><option value="0">Быстрый</option><option value="1" selected>Тактик · с поиском</option></select></label><label id="initiativeLabel" hidden>Кто ходит первым?<select id="initiative"><option value="0">Я</option><option value="1">Соперник</option></select></label><button id="editDeck">Составить колоду</button></div><p id="deckSummary" class="quiet"></p><button id="startBtn" class="gold wide">Раздать карты →</button></dialog>
<dialog id="content"><button class="close" id="closeContent" aria-label="Закрыть">×</button><div id="contentBody"></div></dialog>
<dialog id="result"><div class="result-medallion" aria-hidden="true"><img src="assets/ui/wolf-medallion-adapted.webp" alt=""></div><span class="eyebrow">ПАРТИЯ ЗАВЕРШЕНА</span><h2 id="resultTitle"></h2><p id="resultText"></p><button id="again" class="gold wide">Новая партия</button><button id="review" class="wide">Посмотреть поле</button></dialog>
<dialog id="zoom"><button class="close" id="closeZoom" aria-label="Закрыть карту">×</button><div id="zoomBody"></div></dialog>
<dialog id="chooser"><button id="closeChooser" class="close" aria-label="Вернуться к полю">×</button><h2 id="choiceTitle"></h2><div class="choice-navigation"><button id="choicePrev" aria-label="Предыдущая карта">‹</button><div id="choiceCards"></div><button id="choiceNext" aria-label="Следующая карта">›</button></div><div id="choiceActions"></div></dialog><script src="board-preview.js?v=20261015-10"></script><script src="effects.js?v=20261015-10"></script><script src="app.js?v=20261015-10"></script><script src="placement.js?v=20261015-10"></script><script src="interface.js?v=20261015-10"></script><script src="guide.js?v=20261015-10"></script></body></html>
